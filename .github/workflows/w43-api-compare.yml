name: W43 API comparison

on:
  workflow_dispatch:
    inputs:
      execute:
        description: Compare both models, one request each (false = offline only)
        type: boolean
        default: false
        required: true
      spec_confirmed:
        description: Both providers' specifications, key access and terms reviewed
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: w43-api-compare
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare and compare both fixed inputs
        id: prepare
        env:
          EXECUTE: ${{ inputs.execute }}
          SPEC_CONFIRMED: ${{ inputs.spec_confirmed }}
        run: |
          args=()
          if [ "$EXECUTE" = "true" ]; then args+=(--execute); fi
          if [ "$SPEC_CONFIRMED" = "true" ]; then args+=(--spec-confirmed); fi
          python scripts/w43_batch_compare.py prepare --run-name "actions-${{ github.run_id }}-${{ github.run_attempt }}" "${args[@]}"
      - name: Check both credentials without network access
        id: credentials
        if: ${{ inputs.execute && steps.prepare.outcome == 'success' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PLAMO_API_KEY: ${{ secrets.PLAMO_API_KEY }}
        run: python scripts/w43_batch_compare.py check-credentials --run-name "actions-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Execute Gemini once
        id: gemini
        if: ${{ !cancelled() && inputs.execute && steps.credentials.outcome == 'success' }}
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/w43_api_compare.py --model gemini-3.6-flash --execute --spec-confirmed --run-name "actions-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Execute PLaMo once regardless of Gemini API result
        id: plamo
        if: ${{ !cancelled() && inputs.execute && steps.credentials.outcome == 'success' }}
        continue-on-error: true
        env:
          PLAMO_API_KEY: ${{ secrets.PLAMO_API_KEY }}
        run: python scripts/w43_api_compare.py --model plamo-3.1-prime --execute --spec-confirmed --run-name "actions-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Publish comparison and fail on incomplete or failed results
        if: ${{ always() }}
        env:
          GEMINI_OUTCOME: ${{ steps.gemini.outcome }}
          PLAMO_OUTCOME: ${{ steps.plamo.outcome }}
        run: python scripts/w43_batch_compare.py summarize --run-name "actions-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Collect both providers and comparison table
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: w43-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            experiments/w43-api-compare/runs/comparison/actions-${{ github.run_id }}-${{ github.run_attempt }}/preflight.json
            experiments/w43-api-compare/runs/comparison/actions-${{ github.run_id }}-${{ github.run_attempt }}/comparison.json
            experiments/w43-api-compare/runs/comparison/actions-${{ github.run_id }}-${{ github.run_attempt }}/comparison.md
            experiments/w43-api-compare/runs/gemini-3.6-flash/actions-${{ github.run_id }}-${{ github.run_attempt }}/input-manifest.json
            experiments/w43-api-compare/runs/gemini-3.6-flash/actions-${{ github.run_id }}-${{ github.run_attempt }}/metrics.json
            experiments/w43-api-compare/runs/gemini-3.6-flash/actions-${{ github.run_id }}-${{ github.run_attempt }}/report.md
            experiments/w43-api-compare/runs/gemini-3.6-flash/actions-${{ github.run_id }}-${{ github.run_attempt }}/candidate.md
            experiments/w43-api-compare/runs/plamo-3.1-prime/actions-${{ github.run_id }}-${{ github.run_attempt }}/input-manifest.json
            experiments/w43-api-compare/runs/plamo-3.1-prime/actions-${{ github.run_id }}-${{ github.run_attempt }}/metrics.json
            experiments/w43-api-compare/runs/plamo-3.1-prime/actions-${{ github.run_id }}-${{ github.run_attempt }}/report.md
            experiments/w43-api-compare/runs/plamo-3.1-prime/actions-${{ github.run_id }}-${{ github.run_attempt }}/candidate.md
          if-no-files-found: warn
          retention-days: 14
