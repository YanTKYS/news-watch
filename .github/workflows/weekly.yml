name: Weekly review

# 直近の日刊ログ（logs/）から週刊レビューを生成する。Brave/Jev APIは使わない。
# 1回の実行で生成するのは最大1週。週を指定しない場合は、直近4週のうち未生成で最も古い週（記事のある週）を選ぶ（欠号補完）。
# Gemini APIは通常1リクエスト。一時的なエラー（429/5xx・タイムアウト）に限り1回だけ再試行する（最大2リクエスト、別モデルへの切り替えなし）。
# 生成済みの週は regenerate 指定時のみ再生成する。実行結果（対象週・区分・APIリクエスト回数など）は実行サマリーに出力する。
# モデルは Repository variable GEMINI_MODEL で変更できる（未設定なら scripts/weekly.py の既定値）。
# トリガーは schedule と workflow_dispatch のみ（Secretを使うため pull_request 等では実行しない）。
on:
  schedule:
    # 毎週月曜 JST 08:29（UTC 日曜 23:29）
    - cron: "29 23 * * 0"
  workflow_dispatch:
    inputs:
      week:
        description: "対象週（ISO 8601、例: 2026-W42）。指定した週だけを処理（欠号補完なし）。空欄なら直近の未生成週を自動選択"
        required: false
        default: ""
      regenerate:
        description: "生成済みでも再生成する（APIを通常1回、一時的なエラー時は最大2回呼びます。週が空欄なら前週）"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

# 週刊・月刊（monthly.yml）は同じグループで直列にする（毎月1日が月曜の日も同時にpushしない）。
# collect.yml とは別グループ（commit対象のファイルが重ならず、push時の pull --rebase で取り込める）。
concurrency:
  group: reviews
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate weekly review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          WEEK: ${{ inputs.week }}
          REGENERATE: ${{ inputs.regenerate }}
        run: |
          args=()
          if [ -n "$WEEK" ]; then args+=(--week "$WEEK"); fi
          if [ "$REGENERATE" = "true" ]; then args+=(--force); fi
          python scripts/weekly.py "${args[@]}"

      - name: Commit and push if the weekly review changed
        run: |
          git add data/weeks.json
          if [ -d reviews/weekly ]; then git add reviews/weekly; fi
          if git diff --cached --quiet; then
            echo "No changes; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: weekly review $(TZ=Asia/Tokyo date +%F)"
          # 日刊収集が先にpushしていても取り込めるようにする（変更ファイルは重ならない）
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((i * 5))
          done
          echo "push failed" >&2
          exit 1
