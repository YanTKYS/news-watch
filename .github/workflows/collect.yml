name: Collect news

# API収集のトリガーは schedule と workflow_dispatch のみ。
# push / pull_request / pull_request_target では絶対に実行しない（Secretを使うため）。
on:
  schedule:
    # 毎日 JST 07:17（UTC 22:17）
    - cron: "17 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect
        env:
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
        run: python scripts/collect.py

      - name: Commit and push if there are new items
        run: |
          git add logs data/seen.json data/months.json data/jev-rejected.json
          if git diff --cached --quiet; then
            echo "No new items; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: collect news $(TZ=Asia/Tokyo date +%F)"
          git push
