# 検索語の設定。1回の実行で使える検索語は合計10件まで（超過するとエラーで停止します）。
# 1検索語につきBrave Search APIへのリクエストは1回です。
# 引用符 "..." は完全一致指定です（YAMLではシングルクォートで全体を囲みます）。
themes:
  - name: 自治体DX
    queries:
      - '"自治体DX"'
      - '"自治体" "デジタル化"'
      - '"市役所" "DX推進"'

  - name: 自治体の生成AI活用
    queries:
      - '"自治体" "生成AI"'
      - '"市役所" "生成AI"'

# 明らかなノイズ・転載を除外します（検索語に NOT site: を付与し、取得後にも同じ条件で除外）。
# exclude_domains: ドメイン名のみ（サブドメインも対象）。http:// やパスは書けません。
exclude_domains:
  - wikipedia.org
  - headtopics.com
  - topics.smt.docomo.ne.jp

# exclude_url_patterns: URL（スキームを除く）に含まれる文字列。ドメイン全体は残したい転載URL向け。
exclude_url_patterns:
  - "iza.ne.jp/pressrelease/prtimes/"
  - "excite.co.jp/news/article/Prtimes_"
